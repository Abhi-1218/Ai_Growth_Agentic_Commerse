name: GrowthPilot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. BACKEND CONTINUOUS INTEGRATION
  # ==========================================
  backend-ci:
    name: Backend CI (Spring Boot 3.4 + Java 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Run Backend Unit Tests & Package
        working-directory: backend
        run: |
          ./mvnw clean test
          ./mvnw package -DskipTests

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ==========================================
  # 2. FRONTEND CONTINUOUS INTEGRATION
  # ==========================================
  frontend-ci:
    name: Frontend CI (React 19 + TypeScript + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck & Build Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Production Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ==========================================
  # 3. DOCKER BUILD VALIDATION
  # ==========================================
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: growthpilot-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: growthpilot-frontend:test

  # ==========================================
  # 4. CONTINUOUS DEPLOYMENT (TRIGGER)
  # ==========================================
  deploy:
    name: Continuous Deployment (CD Trigger)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deployment Trigger Notice
        run: |
          echo "All CI quality gates passed successfully!"
          echo "Ready to trigger automated CD webhook to Render, Railway, Vercel, or AWS VPS."

      - name: Deploy to Cloud Webhook (Render / Railway / Custom VPS)
        if: env.DEPLOY_HOOK_URL != ''
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$DEPLOY_HOOK_URL"
